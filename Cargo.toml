[workspace]
resolver = "3"
members = ["crates/opc-core", "crates/opc-store", "crates/opc-io", "src-tauri"]
# Die Desktop-App braucht auf Linux zusätzliche Systembibliotheken
# (webkit2gtk, gtk3, libsoup). Sie ist deshalb nicht Teil der
# Standard-Mitglieder: `cargo build` und `cargo test` bleiben damit auf
# jeder Maschine lauffähig, während `cargo build -p openprintcost` die
# Desktop-App baut.
default-members = ["crates/opc-core", "crates/opc-store", "crates/opc-io"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/monosystems/OpenPrintCost"
authors = ["OpenPrintCost Contributors"]

[workspace.dependencies]
rust_decimal = { version = "1.43.0", features = ["serde-with-str", "serde-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
