[workspace]
resolver = "3"
members = ["crates/opc-core", "crates/opc-store", "crates/opc-io", "crates/opc-export", "src-tauri"]
# The desktop app needs additional system libraries on Linux (webkit2gtk,
# gtk3, libsoup). It is therefore not part of the default members:
# `cargo build` and `cargo test` stay runnable on every machine, while
# `cargo build -p openprintcost` builds the desktop app.
#
# The workspace version is the single source of truth for the Rust side
# (see scripts/set-version.sh).
default-members = ["crates/opc-core", "crates/opc-store", "crates/opc-io", "crates/opc-export"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0"
repository = "https://github.com/monosystems/OpenPrintCost"
authors = ["OpenPrintCost Contributors"]

[workspace.dependencies]
rust_decimal = { version = "1.43.0", features = ["serde-with-str", "serde-str"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
