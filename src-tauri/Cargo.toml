[package]
name = "openprintcost"
description = "OpenPrintCost — Kostenkalkulation für 3D-Druck-Aufträge"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
repository = "https://github.com/monosystems/OpenPrintCost"
authors = ["OpenPrintCost Contributors"]
default-run = "openprintcost"

[lib]
name = "openprintcost_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
opc-core = { path = "../crates/opc-core" }
opc-export = { path = "../crates/opc-export" }
opc-io = { path = "../crates/opc-io" }
opc-store = { path = "../crates/opc-store" }
uuid = { version = "1", features = ["v4", "serde"] }

[lints.rust]
unsafe_code = "forbid"
