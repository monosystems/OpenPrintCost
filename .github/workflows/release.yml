name: Release

# On stable tags of the form v<major>.<minor>.<patch>, builds installable
# packages and attaches them to the GitHub Release:
#
#   Linux    — .deb (Debian/Ubuntu), .AppImage (Arch, Fedora, everything else)
#   Windows  — .msi (WiX), .exe (NSIS)
#   macOS    — .dmg, universal (Apple Silicon + Intel)
#
# Dev and pre-release tags (v0.2.0-dev.1, v0.2.0-rc.1) are never published:
# they are built as CI artifacts by bundle.yml only. The in-app updater follows
# releases/latest and must only ever receive production releases.
#
# The release is created as a draft first, the matrix jobs upload their
# assets to it, and only a fully successful build publishes it. This avoids
# the race that parallel jobs would otherwise cause on release creation.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-version:
    name: Versions match the tag
    runs-on: ubuntu-latest
    # Stable tags only. Every dependent job is skipped with this one, so a
    # dev tag can never reach create-release — even if it is pushed by mistake.
    if: ${{ !contains(github.ref_name, '-') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The ancestry check below needs the full history.
          fetch-depth: 0

      - name: Release must come from main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "error: tag $GITHUB_REF_NAME points to a commit that is not on main." >&2
            exit 1
          fi

      - name: Check versions
        # Single source of truth: scripts/check-version.sh compares all
        # sources with each other and with the tag.
        run: ./scripts/check-version.sh "${GITHUB_REF_NAME#v}"

  create-release:
    name: Create draft release
    needs: check-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          # Release notes come from the CHANGELOG section of this version.
          # The section is written by scripts/update-changelog.py when the
          # release is prepared — without it there is nothing to publish.
          NOTES=""
          if [[ -f CHANGELOG.md ]]; then
            NOTES="$(awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { in_section = 1; next }
              in_section && /^## \[/ { exit }
              in_section && /^\[[^]]+\]:/ { next }
              in_section && /^<!--/ { next }
              in_section { print }
            ' CHANGELOG.md)"
          fi
          if [[ -z "${NOTES//[[:space:]]/}" ]]; then
            echo "error: CHANGELOG.md has no section for $VERSION." >&2
            echo "run: ./scripts/update-changelog.py release $VERSION" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists already — reusing it (re-run)"
            gh release edit "$TAG" --draft=true --notes "$NOTES"
            exit 0
          fi
          gh release create "$TAG" \
            --draft \
            --title "OpenPrintCost $TAG" \
            --notes "$NOTES"

  release:
    name: Build package (${{ matrix.label }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux — deb, AppImage
            os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            args: --bundles deb,appimage
          - label: Windows — msi, exe
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: --bundles msi,nsis
          - label: macOS — dmg (universal)
            os: macos-latest
            # universal-apple-darwin has no rust-std component — the two
            # real architectures are what the universal build needs.
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            # `app` is required for the updater artifact: Tauri only creates
            # the `.app.tar.gz` for the `app` target, never for `dmg` alone.
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev \
            libfuse2 file patchelf

      - name: Cache cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          # tauri-action reads the token from the environment, not from an
          # input — without it the upload fails with "GITHUB_TOKEN is
          # required".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts (`*.sig`). Without the key the build
          # fails — the updater config in tauri.updater.conf.json is part of
          # the release build only (see --config below).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenPrintCost ${{ github.ref_name }}"
          releaseDraft: true
          # The updater manifest is assembled by the `update-manifest` job —
          # one complete JSON for all platforms. tauri-action would upload a
          # partial one per matrix job.
          uploadUpdaterJson: false
          # The second config file turns on `createUpdaterArtifacts` — the
          # regular (debug) builds in bundle.yml stay key-free.
          args: ${{ matrix.args }} --config src-tauri/tauri.updater.conf.json

      - name: Upload AppImage under a stable name
        # The Tauri bundle names the file after the product name
        # (OpenPrintCost_0.1.0_amd64.AppImage). The Arch PKGBUILD and
        # download links use a predictable name instead.
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          src="$(find target/release/bundle/appimage -name '*.AppImage' | head -1)"
          if [[ -z "$src" ]]; then
            echo "error: no AppImage found" >&2
            exit 1
          fi
          name="openprintcost-${TAG#v}-x86_64.AppImage"
          cp "$src" "$name"
          gh release upload "$TAG" "$name" --clobber
          echo "uploaded $name"

  update-manifest:
    name: Updater manifest
    needs: [create-release, release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download the release assets
        # Contains the updater artifacts and their `.sig` files.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$TAG" --dir assets --clobber

      - name: Extract the release notes
        # Same section that create-release uses for the release body.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          awk -v v="${TAG#v}" '
            $0 ~ "^## \\[" v "\\]" { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section && /^\[[^]]+\]:/ { next }
            in_section && /^<!--/ { next }
            in_section { print }
          ' CHANGELOG.md > notes.md
          test -s notes.md

      - name: Build latest.json
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ./scripts/make-update-manifest.py \
            --assets assets \
            --version "${TAG#v}" \
            --tag "$TAG" \
            --repo "$REPO" \
            --notes-file notes.md \
            --output latest.json
          cat latest.json

      - name: Upload latest.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" latest.json --clobber

  publish-release:
    name: Publish release
    needs: [create-release, release, update-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        # gh resolves the commit of the release from the repository — without
        # a checkout it aborts with "not a git repository".
        uses: actions/checkout@v7

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false

  checksums:
    name: Checksums
    needs: [create-release, release, update-manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        # gh resolves the repository from the git remote — without a
        # checkout "gh release download" fails with "not a git repository".
        uses: actions/checkout@v7

      - name: Download the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$TAG" --dir assets --clobber

      - name: Create SHA256SUMS
        run: |
          set -euo pipefail
          cd assets
          # Plain file names (no ./ prefix) so that "sha256sum -c SHA256SUMS"
          # works in any directory the user unpacks the assets into.
          # latest.json is updater metadata, not a downloadable package.
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' ! -name 'latest.json' \
            -printf '%f\n' | sort | xargs -d '\n' sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" assets/SHA256SUMS --clobber
