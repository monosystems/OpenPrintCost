name: Release

# On tags of the form v*, builds installable packages and attaches them to
# the GitHub Release:
#
#   Linux    — .deb (Debian/Ubuntu), .AppImage (Arch, Fedora, everything else)
#   Windows  — .msi (WiX), .exe (NSIS)
#   macOS    — .dmg, universal (Apple Silicon + Intel)
#
# The release is created as a draft first, the matrix jobs upload their
# assets to it, and only a fully successful build publishes it. This avoids
# the race that parallel jobs would otherwise cause on release creation.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  check-version:
    name: Versions match the tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check versions
        # Single source of truth: scripts/check-version.sh compares all
        # sources with each other and with the tag.
        run: ./scripts/check-version.sh "${GITHUB_REF_NAME#v}"

  create-release:
    name: Create draft release
    needs: check-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"

          # Release notes come from the CHANGELOG section of this version.
          # The section is written by scripts/update-changelog.py when the
          # release is prepared — without it there is nothing to publish.
          NOTES=""
          if [[ -f CHANGELOG.md ]]; then
            NOTES="$(awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { in_section = 1; next }
              in_section && /^## \[/ { exit }
              in_section && /^\[[^]]+\]:/ { next }
              in_section && /^<!--/ { next }
              in_section { print }
            ' CHANGELOG.md)"
          fi
          if [[ -z "${NOTES//[[:space:]]/}" ]]; then
            echo "error: CHANGELOG.md has no section for $VERSION." >&2
            echo "run: ./scripts/update-changelog.py release $VERSION" >&2
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists already — reusing it (re-run)"
            gh release edit "$TAG" --draft=true --notes "$NOTES"
            exit 0
          fi
          PRERELEASE=""
          if [[ "$TAG" == *-* ]]; then PRERELEASE="--prerelease"; fi
          gh release create "$TAG" \
            --draft \
            --title "OpenPrintCost $TAG" \
            --notes "$NOTES" \
            $PRERELEASE

  release:
    name: Build package (${{ matrix.label }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux — deb, AppImage
            os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            args: --bundles deb,appimage
          - label: Windows — msi, exe
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            args: --bundles msi,nsis
          - label: macOS — dmg (universal)
            os: macos-latest
            # universal-apple-darwin has no rust-std component — the two
            # real architectures are what the universal build needs.
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev \
            libfuse2 file patchelf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-release-

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v1
        env:
          # tauri-action reads the token from the environment, not from an
          # input — without it the upload fails with "GITHUB_TOKEN is
          # required".
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "OpenPrintCost ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          args: ${{ matrix.args }}

      - name: Upload AppImage under a stable name
        # The Tauri bundle names the file after the product name
        # (OpenPrintCost_0.1.0_amd64.AppImage). The Arch PKGBUILD and
        # download links use a predictable name instead.
        if: runner.os == 'Linux'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          src="$(find target/release/bundle/appimage -name '*.AppImage' | head -1)"
          if [[ -z "$src" ]]; then
            echo "error: no AppImage found" >&2
            exit 1
          fi
          name="openprintcost-${TAG#v}-x86_64.AppImage"
          cp "$src" "$name"
          gh release upload "$TAG" "$name" --clobber
          echo "uploaded $name"

  publish-release:
    name: Publish release
    needs: [create-release, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # gh resolves the commit of the release from the repository — without
        # a checkout it aborts with "not a git repository".
        uses: actions/checkout@v4

      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false

  checksums:
    name: Checksums
    needs: [create-release, release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # gh resolves the repository from the git remote — without a
        # checkout "gh release download" fails with "not a git repository".
        uses: actions/checkout@v4

      - name: Download the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release download "$TAG" --dir assets --clobber

      - name: Create SHA256SUMS
        run: |
          set -euo pipefail
          cd assets
          # Plain file names (no ./ prefix) so that "sha256sum -c SHA256SUMS"
          # works in any directory the user unpacks the assets into.
          find . -maxdepth 1 -type f ! -name 'SHA256SUMS' -printf '%f\n' \
            | sort | xargs -d '\n' sha256sum > SHA256SUMS
          cat SHA256SUMS

      - name: Upload SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release upload "$TAG" assets/SHA256SUMS --clobber
