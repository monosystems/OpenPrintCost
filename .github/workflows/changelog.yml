name: Changelog

# Keeps the `[Unreleased]` section of CHANGELOG.md in sync with the commits.
# The list is generated with git-cliff from the Conventional Commits in the
# history (see cliff.toml). Released sections are never touched — they are
# frozen by `./scripts/update-changelog.py release <version>`.

on:
  push:
    branches: [main]
  workflow_dispatch:

# The workflow opens (or updates) a pull request instead of pushing to
# `main` directly. The PR is created with `GITHUB_TOKEN`, so GitHub does not
# start CI for it; a maintainer merges the changelog-only PR with the admin
# pull-request bypass of the `main-protection` ruleset.
permissions:
  contents: write
  pull-requests: write

concurrency:
  group: changelog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Update CHANGELOG.md
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history and all tags: git-cliff compares the commits against
          # the latest tag to find what is unreleased.
          fetch-depth: 0
          fetch-tags: true

      - name: Install git-cliff
        env:
          # Pinned version — the same one the maintainers use locally.
          GIT_CLIFF_VERSION: v2.14.2
        run: |
          set -euo pipefail
          version="${GIT_CLIFF_VERSION#v}"
          curl -sSL -o /tmp/git-cliff.tar.gz \
            "https://github.com/orhun/git-cliff/releases/download/${GIT_CLIFF_VERSION}/git-cliff-${version}-x86_64-unknown-linux-gnu.tar.gz"
          tar -xzf /tmp/git-cliff.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/git-cliff-${version}/git-cliff" /usr/local/bin/git-cliff
          git-cliff --version

      - name: Update the unreleased section
        run: ./scripts/update-changelog.py unreleased

      - name: Open or update the changelog pull request
        # The commit type `chore` is skipped by the changelog generator
        # (see cliff.toml) — the automation does not document itself.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md is already up to date"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c automation/changelog
          git add CHANGELOG.md
          git commit -m "chore(changelog): update unreleased section"
          git push --force origin HEAD:automation/changelog

          if [[ "$(gh pr list --head automation/changelog --state open --json number --jq 'length')" == "0" ]]; then
            gh pr create \
              --base main \
              --head automation/changelog \
              --title "chore(changelog): update unreleased section" \
              --body "Generated from the commits on \`main\` by the Changelog workflow. This PR only updates the \`[Unreleased]\` section; merge it with the admin pull-request bypass after reviewing the diff."
          else
            echo "updated the existing changelog pull request"
          fi
