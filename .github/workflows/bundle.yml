name: Bundle check

# Builds the installable packages on every platform.
#
# The release workflow only runs on tags, so without this a broken bundling
# setup would only surface at release time. This workflow builds the same
# bundle targets in debug profile (fast) and uploads them as artifacts.
#
# Triggered when something packaging-relevant changes.

on:
  pull_request:
    paths:
      - "src-tauri/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
  push:
    branches: ["**"]
    paths:
      - "src-tauri/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "package.json"
      - "package-lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    name: Bundle (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux — deb, AppImage
            os: ubuntu-22.04
            rust-targets: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - label: Windows — msi
            os: windows-latest
            rust-targets: x86_64-pc-windows-msvc
            bundles: msi
          - label: macOS — dmg (universal)
            os: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin,universal-apple-darwin
            bundles: dmg
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Install Tauri system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev libssl-dev \
            libfuse2 file patchelf

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bundle-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build bundle (debug profile)
        # Debug profile keeps the check fast; the release workflow builds the
        # real, optimized packages.
        run: npx tauri build --debug --bundles ${{ matrix.bundles }}

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.os }}
          # The macOS job builds for universal-apple-darwin, so the bundle
          # lands in a target-specific directory. The bundles are written to
          # the workspace target directory (target/), not src-tauri/target/.
          path: |
            target/**/bundle/**/*.deb
            target/**/bundle/**/*.AppImage
            target/**/bundle/**/*.msi
            target/**/bundle/**/*.dmg
          if-no-files-found: error
          retention-days: 7
